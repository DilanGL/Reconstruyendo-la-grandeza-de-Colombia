<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grandeza Colombia - Plan Integral</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .video-controls-gradient { background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, transparent 100%); }
        .survey-card.selected { border-color: #2563eb; background-color: #f8fafc; }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">

  <div id="navbar-container"></div>

    <section id="hero" class="relative bg-slate-900 text-white overflow-hidden min-h-[600px] flex items-center">
        <div class="absolute inset-0 opacity-20 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-blue-500 via-slate-900 to-slate-900"></div>
        <div class="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-20 w-full">
            <div class="md:flex md:items-center md:justify-between gap-12">
                <div class="md:w-1/2 mb-10 md:mb-0">
                    <h1 class="text-4xl md:text-6xl font-extrabold tracking-tight mb-6 leading-tight">
                        Reconstruyendo la <br/>
                        <span class="text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 via-blue-400 to-red-400">Grandeza de Colombia</span>
                    </h1>
                    <p class="text-lg text-slate-300 mb-8 max-w-xl leading-relaxed italic">
                        "La historia de las naciones no está escrita en piedra, sino en la voluntad inquebrantable de sus ciudadanos."
                    </p>
                </div>
               <!-- Columna Multimedia (Contenedor Inteligente) con Selector Dinámico -->
               <div class="md:w-1/2">
                    <div id="media-container" class="relative aspect-video bg-black rounded-2xl shadow-2xl border border-white/10 overflow-hidden group">
                        
                        <div class="absolute top-4 left-4 z-30 flex space-x-2 bg-slate-900/80 backdrop-blur-md p-1 rounded-xl border border-white/10">
                            <button id="btn-show-img" onclick="switchMedia('img')" class="px-3 py-1.5 text-xs font-bold rounded-lg transition-all bg-blue-600 text-white">
                                <i class="fa-solid fa-image mr-1"></i> Imagen
                            </button>
                            <button id="btn-show-video" onclick="switchMedia('video')" class="px-3 py-1.5 text-xs font-bold rounded-lg transition-all text-slate-400 hover:text-white">
                                <i class="fa-solid fa-video mr-1"></i> Video
                            </button>
                        </div>
                
                        <img id="hero-img" src="https://lh3.googleusercontent.com/d/1Jh0CsZD9LDNPKhhmqVJndMGNRInKwAi3" alt="Vista Principal" class="w-full h-full object-cover opacity-80 group-hover:opacity-100 transition-opacity">
                
                        <div id="hero-video-wrapper" class="hidden w-full h-full">
                            <iframe 
                                id="hero-youtube"
                                class="w-full h-full"
                                src="https://www.youtube.com/embed/bR2mUHFk_KE?enablejsapi=1&rel=0&modestbranding=1" 
                                title="Grandeza Colombia - Video" 
                                frameborder="0" 
                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                allowfullscreen>
                            </iframe>
                        </div>
                
                    </div>
                    <p id="media-caption" class="text-center text-slate-500 text-xs mt-3 italic">Mostrando imagen oficial del proyecto</p>
                </div>
            </div>
        </div>
    </section>

    <footer class="bg-slate-900 text-slate-400 py-12 text-center">
        <p class="text-sm">Grandeza Colombia © 2026 - Hacia un estándar de excelencia nacional.</p>
    </footer>

    <script src="js/global.js"></script>
</body>
</html>
